[package]
name = "experiment-runner"
version = "0.1.0"
edition = "2021"
description = "Reproducible experiment runner for C0-C7 cyber-investigation agent conditions"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.8.26"
sha2 = "0.10"
thiserror = "2"
